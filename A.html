const FORM_ACTION="https://docs.google.com/forms/d/e/1FAIpQLSf5hPkq55xVZP8-vLfiaP3h4afk1DRy26UxEfNGjTTal_SPug/formResponse";
const FORM_FIELDS=[{"id":526583383,"title":" 第1題（單選） 您的性別","entry":1856476778,"options":["男","女","我不想透露性別"],"required":true},{"id":1730741079,"title":"  第2題（單選） 您的年齡層為何？   ","entry":816472500,"options":["18歲以下","18–25歲","26–40歲","41–64歲","65歲以上"],"required":true},{"id":1394376606,"title":"  第3題（單選） 您的身分類別為何？   ","entry":1785673124,"options":["一般民眾","原住民","新住民","其他"],"required":true},{"id":841299383,"title":"  第4題（單選）  您是否已申辦手機條碼載具（雲端發票）？  ","entry":829397431,"options":["已申辦","尚未申辦","不清楚"],"required":true},{"id":872434151,"title":"第1題    \n小美想參加雲端發票抽獎，又不想拿紙本發票，她應該怎麼做？","entry":2142963366,"options":["拿紙本發票回家收好。","請店員將發票存入載具。 ✅","不拿發票也沒關係。","請店員把發票丟掉。"],"required":true},{"id":526969438,"title":"第2題    小美到學校附近飲料店買飲料，店員問：「發票要存手機條碼嗎？」選擇存手機條碼最大的好處是什麼？  ","entry":783179730,"options":["中獎時一定不用領獎。","發票可集中管理，還可享有雲端發票專屬獎。 ✅","存手機條碼後就不能查詢發票。","只有學生才能使用手機條碼。"],"required":true},{"id":1479774076,"title":"第3題    阿宏在網路購物完成付款後，想確認電子發票是否已存入自己的手機條碼，最方便的方式是什麼？  ","entry":1480365050,"options":["等店家寄紙本發票到家。","使用財政部統一發票兌獎 App 查詢。 ✅","打電話請店家每天幫忙查詢。","重新再購買一次商品。"],"required":true},{"id":1063690173,"title":"第4題    小華把雲端發票存入手機條碼，並事先設定好領獎帳戶，中獎後有什麼好處？  ","entry":91881228,"options":["一定要到超商列印發票才能領獎。","一定要到國稅局辦理領獎。","獎金可自動匯入指定帳戶，方便又省時。 ✅","中獎後必須重新登錄手機條碼。"],"required":true},{"id":1783438314,"title":"第5題    小美想把雲端發票捐給公益團體，以下哪一種方式最方便？  ","entry":2144748569,"options":["把紙本發票寄給公益團體。","使用手機條碼或統一發票兌獎 App，設定捐贈碼捐贈雲端發票。 ✅","中獎後才能捐贈發票。","雲端發票不能捐贈。"],"required":true},{"id":1352063346,"title":"📚 闖關二｜租稅知識小達人 區段說明（直接貼上） \n歡迎來到第二關！ 情境題目 \n租稅與我們的生活息息相關，從日常消費到公共建設、教育、醫療及社會福利，都需要租稅作為重要的財政來源。\n一起完成挑戰，認識正確的租稅觀念，成為守法納稅、誠實報稅的好公民！  \n第1題 小華暑假打工賺到人生第一份薪水，他想了解為什麼要依法申報所得稅。請問下列哪一項是正確的觀念？","entry":2127784290,"options":["繳稅只是增加自己的負擔，沒有其他作用。","只有高收入的人才需要了解租稅知識。","租稅是政府推動公共建設、教育、醫療及各項公共服務的重要財源。✅","不管收入多少，都不需要關心租稅規定。"],"required":true},{"id":1418095281,"title":"第2題  小美第一次收到綜合所得稅結算申報通知，覺得內容很複雜，想直接放著不管。請問下列哪一種做法最正確？","entry":670234166,"options":["不理會通知，等國稅局再提醒就好。","先向家人、學校老師或國稅局詢問，並依規定辦理申報。 ✅","在網路上找不明人士代辦即可，不必確認身分。","覺得麻煩，就請朋友代替自己隨便填寫資料。"],"required":true},{"id":1169471733,"title":"第3題  阿杰是一位網紅，最近開始接廠商合作拍影片，並獲得合作收入。請問下列哪一項觀念是正確的？ ","entry":1335541230,"options":["只要是網路收入，就不用依法申報。","只要不是正職工作，就不用申報所得。","無論是拍影片、直播或接業配，只要有所得，都應依稅法規定辦理。 ✅","網紅收入不用保存任何相關資料。"],"required":true},{"id":525710345,"title":"第4題 小美到金門大學就讀後在外租屋，想申請租金補貼。下列哪一項說法正確？ ","entry":1192399328,"options":["申請租金補貼一定要先取得房東同意。","只有房東才能申請租金補貼。","申請租金補貼後，房東一定會被加重課稅。","符合資格申請租金補貼後，房東可成為公益出租人，並享有綜合所得稅優惠。 ✅"],"required":true},{"id":846222191,"title":"第5題 阿宏利用 AI 查詢稅務資訊，但仍不確定答案是否正確，最適合怎麼做？ ","entry":1168793638,"options":["完全相信 AI 的回答。","撥打國稅局免付費電話 0800-000-321 詢問。 ✅","聽朋友怎麼說就怎麼做。","不理會，等收到通知再說。"],"required":true},{"id":1045701196,"title":"第1題 小美到金門買貢糖和高粱酒，聽朋友說：「金門免徵營業稅，所以店家都不用開立統一發票。」請問下列哪一項說法正確？ ","entry":1107014400,"options":["金門免徵營業稅，所以所有店家都不用開立統一發票。","金門雖免徵營業稅，但經核定使用統一發票的營業人，仍應依法開立統一發票。 ✅","金門只有賣高粱酒才要開立統一發票。","金門只有觀光客消費才會開立統一發票。"],"required":true},{"id":1988260277,"title":"第2題    阿凱到金門一家使用統一發票的特產店購買貢糖，店員忘記開立統一發票。下列哪一項說法正確？ ","entry":1400600065,"options":["金門免徵營業稅，所以店家可以不用開立統一發票。","消費者沒有主動索取，店家就不用開立統一發票。","使用統一發票之營業人，應主動開立統一發票並交付消費者。 ✅","只有消費金額超過一定金額才需要開立統一發票。"],"required":true},{"id":883954565,"title":"第3題    小美到金門一家使用統一發票的商店消費後，主動索取統一發票。下列哪些是主動索取統一發票的好處？  ","entry":872134800,"options":["可參加統一發票開獎，使用雲端發票還可享有雲端發票專屬獎的中獎機會。","可作為購物憑證，保障消費權益。","可防止商家逃漏稅，維護國家稅收。","以上皆是。 ✅"],"required":true},{"id":1269067042,"title":"第4題    小華到金門旅遊購買伴手禮，在使用統一發票的商店結帳時，店員詢問是否要將發票存入手機條碼。請問使用雲端發票有哪些好處？  ","entry":1757348569,"options":["不怕發票遺失，還可享有雲端發票專屬獎的中獎機會。 ✅","可以免繳營業稅。","可以直接折抵下次購物金額。","可以免繳綜合所得稅。"],"required":true},{"id":1533371555,"title":"第5題 金門地區實施免徵營業稅制度，下列哪一項說法正確？","entry":1608758734,"options":["金門所有商家都不用開立統一發票。","金門所有商品都免稅。","金門免徵營業稅，但仍應依相關規定辦理稅務及統一發票事項。 ✅","金門居民都不用繳稅。"],"required":true},{"id":1270643629,"title":"  第1題   繼承平權   情境故事】 阿公說：「男生要拜祖先，所以遺產應該留給男生；已出嫁的大姑、小姑就不用分家產，大孫子大明最孝順，可以多分一份。」\n小明說：「阿公，現在法律規定不是這樣。遺產應由阿嬤、爸爸、大姑、小姑等法定繼承人依法繼承，不能因為女兒出嫁就沒有繼承權。而且爸爸還健在，我身為孫子，一般情況下也不是您的法定繼承人。」\n【問題】依照我國現行民法規定，下列何者正確？","entry":891376313,"options":["已出嫁的女兒不能繼承父母遺產。","男生拜祖先，所以可以多分遺產。","子女的繼承權不因性別或是否出嫁而有所不同。✅","長孫可以直接繼承祖父全部遺產。"],"required":true},{"id":1146825840,"title":"  第2題   家事共同分擔 \n 【情境故事】\n晚餐後，媽媽正在洗碗、整理廚房。\n爸爸說：「男生不用做家事，去休息就好了。」\n小華笑著說：「爸爸，現在家事應該由全家人一起分擔，不是只有媽媽或女生負責，我也一起幫忙吧！」\n【問題】下列哪一種做法最符合性別平等觀念？","entry":1600233664,"options":["家事應由媽媽和姊姊負責。","男生不用做家事，只要專心讀書。","家事應由家人共同分擔，不因性別而有所不同。✅","女生比較細心，所以所有家事都由女生負責。"],"required":true},{"id":123607629,"title":"第3題  打破性別刻板印象 \n【情境故事】 \n學校舉辦職涯分享會，小美說：「我想當警察。」\n同學小強笑著說：「警察不是男生在當的嗎？」\n老師聽到後說：「只要具備能力和熱忱，不論男女，都有機會從事自己喜歡的職業。」\n【問題】下列哪一種觀念最符合性別平等？","entry":1981555610,"options":["男生比較適合當警察，女生比較適合當護理師。","選擇職業應依照性別決定。","每個人都應選擇傳統認為適合自己性別的工作。","每個人都可以依自己的興趣、能力選擇職業，不受性別限制。 ✅"],"required":true},{"id":1005562969,"title":"第4題    打造友善職場\n  【情境故事】\n小明的同事阿國請了育嬰留職停薪，回來上班後，同事小王笑著說：「照顧小孩不是媽媽的工作嗎？男生請育嬰假多奇怪！」\n主管聽到後說：「照顧孩子是父母共同的責任，公司也支持每位同仁兼顧工作與家庭。」\n【問題】下列哪一種觀念最符合性別平等？","entry":8613306,"options":["照顧孩子是媽媽的責任，爸爸不用請育嬰假。","男性請育嬰假會影響工作，不應該請。","只有女性才需要兼顧家庭與工作。","不論男女，都可以共同照顧家庭，職場也應給予支持。 ✅"],"required":true},{"id":355605766,"title":"第5題 拒絕跟蹤騷擾 \n【情境故事】 \n小美放學後，發現有人連續好幾天跟著她，還一直傳送訊息，讓她感到害怕。她想起學校宣導的「拒絕跟蹤騷擾」海報。\n【問題】遇到跟蹤騷擾時，下列哪一種做法最適當？","entry":184383696,"options":["假裝沒事，自己忍耐。","與對方見面，把事情說清楚。","前往安全地點，必要時撥打110或113尋求協助。 ✅","覺得只是開玩笑，不需要理會。"],"required":true},{"id":414539943,"title":"第1題 小明收到一封電子郵件，內容寫著：「您的雲端發票中獎，請立即點擊連結並輸入帳號密碼，否則將取消領獎資格。」請問下列何者最適當？ ","entry":958710698,"options":["立即點擊連結完成領獎。","輸入帳號、密碼及個人資料。","不點擊郵件連結，改到官方網站或官方 APP 查詢，必要時撥打165查證。 ✅","依照郵件指示操作 ATM。"],"required":true},{"id":951505191,"title":"第2題 雲端發票中獎自動匯款  小華使用財政部統一發票兌獎 APP，想讓雲端發票中獎後領獎更方便。下列哪一項做法最適當？ ","entry":1914458590,"options":["中獎後一定要到超商列印紙本發票才能領獎。","中獎後一定要到超商列印紙本發票才能領獎。 ✅","收到中獎簡訊後，點擊簡訊中的連結輸入資料。","中獎後必須先繳交手續費才能領獎。"],"required":true},{"id":1209308962,"title":"第3題  小華收到一封電子郵件，內容寫著：「請立即輸入您的信用卡卡號及安全碼，才能完成電子發票載具歸戶及領獎設定。」請問下列何者正確？ ","entry":1523257928,"options":["依照郵件要求輸入信用卡卡號及安全碼。","為了順利領獎，立即完成資料填寫。","財政部電子發票整合服務平台辦理載具歸戶或領獎設定時，絕對不會寄發電子郵件要求民眾輸入信用卡卡號及安全碼。 ✅","將信用卡資料提供給對方確認身分。"],"required":true},{"id":1429804580,"title":"第4題  小心發票中獎詐騙信  小強 收到一封「發票中獎通知」電子郵件， const GROUPS={"雲端發票小達人": [["雲端發票小達人", "小美到便利商店買飲料，結帳時店員問：「發票要存手機條碼嗎？」她不確定存手機條碼有什麼好處。下列何者正確？", ["不用保存紙本發票，比較環保。", "中獎會有通知，比較不容易錯過。", "還可能享有雲端發票專屬獎。", "以上皆是。"], 3, "想想「無紙化、通知、專屬獎」三件事。", "三個好處都成立，所以要找能同時包含三者的選項。", "雲端發票可減少紙本、協助中獎通知，也有雲端發票專屬獎。"], ["雲端發票小達人", "小美到傳統商店結帳時店家說「發票沒有手機條碼」，這種說法正確嗎？", ["中獎時一定不用繳稅。", "發票可集中管理，還可享有雲端發票專屬獎。", "存手機條碼後不能查消費。", "只有學生才能使用手機條碼。"], 1, "手機條碼的重點是「集中」與「方便」。", "想想雲端發票能不能統一管理、查詢與領獎。", "使用手機條碼可集中管理雲端發票，並可能享有雲端發票專屬獎。"], ["雲端發票小達人", "阿宏在網路購物完成付款後，想確認電子發票是否已存入自己的手機條碼，最方便的方式是？", ["等店家寄紙本發票到家。", "使用財政部統一發票兌獎 App 查詢。", "打電話請店家每天幫忙查詢。", "重新再購買一次商品。"], 1, "不用等紙本，手機就能查。", "找「官方 App 查詢」的選項。", "使用官方統一發票兌獎 App，可查詢已歸戶或載具中的發票。"], ["雲端發票小達人", "小華把雲端發票存入手機條碼，並事先設定好領獎帳戶，中獎後有什麼好處？", ["一定要到超商列印發票才能領獎。", "一定要到國稅局辦理領獎。", "獎金可自動匯入指定帳戶，方便又省時。", "中獎後必須重新登錄手機條碼。"], 2, "題目已經說「事先設定好領獎帳戶」。", "設定帳戶後，想想中獎款項可以怎麼處理。", "設定領獎帳戶後，符合條件的獎金可自動匯入指定帳戶。"], ["雲端發票小達人", "小美想把雲端發票捐給公益團體，以下哪一種方式最方便？", ["把紙本發票寄給公益團體。", "使用手機條碼或統一發票兌獎 App，設定捐贈碼捐贈雲端發票。", "中獎後才能捐贈發票。", "只能親自到國稅局捐贈。"], 1, "雲端發票的捐贈也可以「雲端化」。", "找手機條碼、官方 App、捐贈碼相關選項。", "透過手機條碼、統一發票兌獎 App 與捐贈碼即可便利捐贈。"]], "租稅知識小達人": [["租稅知識小達人", "小華暑假打工賺到人生第一份薪水，他想了解為什麼要依法申報所得稅。哪個觀念最正確？", ["繳稅只是增加自己的負擔，沒有其他作用。", "只有高收入的人才需要了解租稅知識。", "租稅是政府推動公共建設、教育、醫療及公共服務的重要財源。", "不論收入多少，都不要關心租稅規定。"], 2, "想想公共服務的經費從哪裡來。", "租稅不只跟個人有關，也支持公共建設與服務。", "依法納稅是公共財政的重要來源，用於公共建設與各項公共服務。"], ["租稅知識小達人", "小美第一次收到綜合所得稅結算申報通知，覺得內容很複雜，想直接放著不管。哪個做法較正確？", ["不理會通知，等國稅局再提醒就好。", "先向家人、學校老師或國稅局詢問，並依規定辦理申報。", "在網路上找不明人士代辦即可。", "覺得麻煩，就請朋友代替自己隨便填資料。"], 1, "遇到不懂的稅務問題，先找可信賴來源。", "家人、老師、國稅局，比陌生網友可靠。", "不懂申報內容時，應向可信賴人士或稅捐機關詢問並依法申報。"], ["租稅知識小達人", "阿杰是一位網紅，最近開始接廠商合作拍影片並獲得合作收入。下列哪個觀念正確？", ["只要是網路收入，就不用依法申報。", "只要不是正職工作，就不用申報所得。", "無論是拍影片、直播或接業配，只要有所得，都應依法辦理申報。", "網紅收入不用保存任何相關資料。"], 2, "重點不是「是不是正職」，而是有沒有所得。", "合作、業配、直播等收入也可能屬所得。", "各類所得原則上都應依稅法規定辦理申報。"], ["租稅知識小達人", "小美到金門大學念書，在外租屋，想申請租金補貼。下列哪一項說法正確？", ["申請租金補貼一定要先取得房東同意。", "只有房東才能申請租金補貼。", "申請租金補貼時，房東一定會被加重課稅。", "符合資格者可依規定提出申請，並依制度辦理。"], 3, "不要把租屋補貼想成一定要房東先同意。", "看「符合資格、依規定申請」的敘述。", "租金補貼依制度與資格辦理，不應因錯誤迷思而放棄權益。"], ["租稅知識小達人", "阿宏利用 AI 查詢稅務資訊，但  if(page==='stageIntro'){let x=STAGES[stage];P(`第 ${stage+1} 關｜準備開始`,5+stage*13);app.innerHTML=`<div class=stageIntro><h2>${x.title}</h2><p><b>${PAPER}版</b></p><p>${x.intro}</p><p><b>本關1題，只出現本關主題。</b></p><button class=btn onclick=startStage()>開始第 ${stage+1} 關 →</button></div>`;return}

function saveBasics(){for(let x=1;x<=4;x++){const a=document.querySelector(`input[name=b${x}]:checked`);if(!a){document.getElementById('basicmsg').innerHTML='<p class=bad>請完成4題基本資料。</p>';return}responses['entry.'+BASIC_FIELDS[x-1].entry]=a.value;profile['b'+x]=a.value}page='stageIntro';R()}
function startStage(){qs=makeQs(STAGES[stage].key);i=0;tries=0;solved=false;score=0;page='q';R()}
function check(){
 if(solved)return;
 const selector=`input[name=answer_${stage}_${i}]:checked`;
 const a=document.querySelector(selector),m=document.getElementById('msg');
 if(!a){m.innerHTML='<p class=bad>請先選一個答案。</p>';return}
 const q=qs[i],v=parseInt(a.value,10),correct=parseInt(q[3],10);responses['entry.'+q[7]]=q[8][v];
 if(v===correct){
   solved=true;score++;
   document.querySelectorAll(`input[name=answer_${stage}_${i}]`).forEach(x=>x.disabled=true);
   m.innerHTML=`<p class=good>答對了！✓</p><div class=helper><b>解析：</b>${q[6]}</div><p><button class=btn onclick=next()>下一題 →</button></p>`;
 }else{
   tries++;
   const h=tries===1?q[4]:tries===2?q[5]:`正確答案：${String.fromCharCode(65+correct)}. ${q[2][correct]}<br>${q[6]}`;
   m.innerHTML=`<p class=bad>${tries<3?'再想想看。':'已提供正確答案與解析。'}</p><div class=helper>${h}</div>${tries>=3?'<p><button class=btn onclick=next()>下一題 →</button></p>':''}`;
 }
}
function help(){let q=qs[i];document.getElementById('ai').innerHTML=`<div class=helper><b>🤖 AI 智能稅務小幫手</b><p>${tries===0?q[4]:tries===1?q[5]:q[6]}</p></div>`}
function next(){i++;tries=0;solved=false;if(i>=1)page='stageDone';R()}
function advance(){if(stage<5){stage++;page='stageIntro'}else page='feedback';R()}
function survey(n,q,o){return `<div style="margin:18px 0"><b>${q}</b>${o.map(x=>`<label class=opt><input type=radio name=${n} value="${x}"> ${x}</label>`).join('')}</div>`}
function submitToGoogle(){page='submitting';R();const frame=document.createElement('iframe');frame.name='yeh_submit_target';frame.style.display='none';document.body.appendChild(frame);const form=document.createElement('form');form.method='POST';form.action=FORM_ACTION;form.target=frame.name;form.style.display='none';const add=(name,value)=>{const input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;form.appendChild(input)};Object.entries(responses).forEach(([k,v])=>add(k,v));add('fvv','1');add('pageHistory','0,1,2,3,4,5,6,7');document.body.appendChild(form);form.submit();setTimeout(()=>{form.remove();frame.remove();page='certificate';R()},3000)}
function finishFeedback(){for(let x=1;x<=5;x++){const a=document.querySelector(`input[name=f${x}]:checked`);if(!a){document.getElementById('fb').innerHTML='<p class=bad>請完成5題活動回饋。</p>';return}responses['entry.'+FEEDBACK_FIELDS[x-1].entry]=a.value}submitToGoogle()}
function restart(){preparePapers();page='intro';stage=0;qs=[];i=0;tries=0;solved=false;score=0;profile={};Object.keys(responses).forEach(k=>delete responses[k]);R()}
preparePapers();R();
